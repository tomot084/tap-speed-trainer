<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1325"><title>交互タップ測定 v2.1</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#0b1325;color:#f2f6ff;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}main{max-width:760px;margin:auto;padding:16px;padding-bottom:36px}h1{font-size:23px;margin:10px 0}p,.note{color:#b8c7df;font-size:13px;line-height:1.55}h2{font-size:19px}.line{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}button,select{background:#263b60;color:#fff;border:1px solid #526b94;border-radius:10px;padding:12px;font-size:15px;font-weight:650}button.selected,.primary{background:#2188e4;border-color:#2188e4}button:disabled{opacity:.5}.line button{flex:1}label{display:block;font-size:13px;color:#b9c9df;margin:12px 0 5px}select{width:100%}.status{text-align:center;font-size:19px;min-height:28px;margin:13px 0}.pad{height:clamp(270px,43dvh,520px);border:2px solid #3c79b8;border-radius:18px;overflow:hidden;position:relative;touch-action:none;overscroll-behavior:contain;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;background:#1b2b47}.pad.running{border-color:#30d0a6}.zones{width:100%;height:100%;display:grid;pointer-events:none}.zone{display:flex;align-items:center;justify-content:center;text-align:center;font-size:clamp(16px,3.8vw,26px);font-weight:800;padding:8px;border:1px solid #536987}.index{background:#1d4165}.middle{background:#454067}.zones.lr{grid-template-columns:1fr 1fr}.zones.tb{grid-template-rows:1fr 1fr}.zones.diag{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.zones.diag .index{grid-area:1/1/2/2}.zones.diag .middle{grid-area:2/2/3/3}.zones.diag .empty{background:#1a2b43}.zones.single .zone{grid-area:1/1}.zones.single .middle{display:none}.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1325c9;font-size:25px;font-weight:800;text-align:center;pointer-events:none;padding:16px}.overlay[hidden]{display:none}.hint{text-align:center;color:#a9bddb;font-size:12px;margin-top:7px}.panel{background:#182842;border-radius:16px;padding:16px;margin-top:18px}.panel[hidden]{display:none}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center}.stat b{font-size:26px;display:block}.stat small{font-size:11px;color:#afc1db}.details{line-height:1.9;font-size:14px}.bars{display:flex;align-items:end;gap:5px;height:125px;border-bottom:1px solid #8b99ad;padding-top:24px;margin-top:24px}.bar{flex:1;background:#38b6e8;border-radius:4px 4px 0 0;position:relative}.bar span{position:absolute;top:-22px;left:0;right:0;text-align:center;font-size:12px}.ticks{display:flex;gap:5px}.ticks span{flex:1;text-align:center;color:#b6c6de;font-size:11px}.wide{width:100%;margin-top:14px}#copymsg{text-align:center;color:#69e4c0;min-height:20px;font-size:13px}
</style></head><body><main>
<h1>⚡ 交互タップ測定 v2.1</h1><p>人差し指・中指を別々に計測。指が同時に触れた時間も調べられます。結果はコピーしてChatGPTに貼り付けられます。</p>
<label>測定時間</label><div class="line" id="durations"><button data-s="3">3秒</button><button data-s="5">5秒</button><button data-s="10" class="selected">10秒</button></div>
<label for="layout">測定エリアの配置</label><select id="layout"><option value="lr">左右分割（左：人差し指／右：中指）</option><option value="tb">上下分割（上：人差し指／下：中指）</option><option value="diag">斜め配置（左上：人差し指／右下：中指）</option><option value="single">全面エリア（指の区別なし）</option></select>
<label for="swap">指の配置</label><select id="swap"><option value="normal">表示どおり</option><option value="reverse">人差し指と中指を入れ替える</option></select>
<div class="line"><button id="start" class="primary">測定開始（3秒後）</button><button id="reset">リセット</button></div>
<div class="status" id="status">待機中</div>
<div class="pad" id="pad"><div class="zones lr" id="zones"><div class="zone index" data-zone="index">人差し指</div><div class="zone middle" data-zone="middle">中指</div></div><div class="overlay" id="overlay">開始ボタンを押してね</div></div>
<div class="hint">計測中は色のついたエリアをタップ。終了後のタップでは再開しません。</div>
<section class="panel" id="results" hidden><h2>測定結果</h2><div class="stats"><div class="stat"><b id="total">0</b><small>合計タップ</small></div><div class="stat"><b id="avg">0</b><small>平均CPS</small></div><div class="stat"><b id="peak">0</b><small>最高1秒CPS</small></div></div><div class="details" id="details"></div><h2>1秒ごとの回数</h2><div class="bars" id="bars"></div><div class="ticks" id="ticks"></div><button id="copy" class="primary wide">📋 結果をコピー</button><div id="copymsg"></div></section>
<p class="note">※指の識別は接触位置に基づきます。斜め配置の空白部分は集計しません。2本同時接触はタッチの重なりから推定し、画面外やブラウザによる接触の取りこぼしは検知できません。時間はブラウザ内の計測値です。</p>
</main><script>
(()=>{'use strict';
const $=id=>document.getElementById(id);const pad=$('pad'),zones=$('zones'),overlay=$('overlay'),status=$('status');let seconds=10,mode='idle',startAt=0,events=[],timer=null,touches=new Map(),overlapStart=null,overlapMs=0,overlapCount=0,lastReport='';
const now=()=>performance.now(),names={index:'人差し指',middle:'中指',single:'全面'};
function clearTimer(){if(timer!==null){clearInterval(timer);timer=null}}
function modeSet(m){mode=m;$('start').disabled=m==='running'||m==='countdown';$('layout').disabled=$('swap').disabled=m==='running'||m==='countdown';document.querySelectorAll('#durations button').forEach(b=>b.disabled=m==='running'||m==='countdown');pad.classList.toggle('running',m==='running')}
function renderLayout(){let layout=$('layout').value,swap=$('swap').value==='reverse';zones.className='zones '+layout;const index=zones.querySelector('.index'),middle=zones.querySelector('.middle');index.textContent=swap?'中指':'人差し指';middle.textContent=swap?'人差し指':'中指';zones.querySelectorAll('.empty').forEach(e=>e.remove());if(layout==='diag'){for(let i=0;i<2;i++){const e=document.createElement('div');e.className='empty';e.style.gridArea=i===0?'1/2/2/3':'2/1/3/2';zones.append(e)}}if(layout==='single')index.textContent='交互タップ（全面）'}
function which(x,y){const rect=pad.getBoundingClientRect(),rx=(x-rect.left)/rect.width,ry=(y-rect.top)/rect.height;let z=null;switch($('layout').value){case 'lr':z=rx<.5?'index':'middle';break;case 'tb':z=ry<.5?'index':'middle';break;case 'diag':z=rx<.5&&ry<.5?'index':rx>=.5&&ry>=.5?'middle':null;break;case 'single':z='single'}if(z&&z!=='single'&&$('swap').value==='reverse')z=z==='index'?'middle':'index';return z}
function concurrent(){if($('layout').value==='single')return touches.size>=2;const vals=[...touches.values()];return vals.includes('index')&&vals.includes('middle')}
function syncOverlap(t){const both=concurrent();if(both&&overlapStart===null){overlapStart=t;overlapCount++}else if(!both&&overlapStart!==null){overlapMs+=Math.max(0,t-overlapStart);overlapStart=null}}
function touchDown(id,x,y,t){if(touches.has(id)||mode!=='running')return;const z=which(x,y);if(z===null)return;touches.set(id,z);if(t<startAt+seconds*1000)events.push({t,z,x,y});syncOverlap(t)}
function touchUp(id,t){if(!touches.has(id))return;touches.delete(id);syncOverlap(t)}
function finish(){if(mode!=='running')return;const end=startAt+seconds*1000;if(overlapStart!==null){overlapMs+=Math.max(0,end-overlapStart);overlapStart=null}clearTimer();modeSet('done');overlay.hidden=false;overlay.textContent='終了（タップしても再開しません）';status.textContent='測定終了！';const counts=Array(seconds).fill(0);let index=0,middle=0;for(const e of events){const i=Math.floor((e.t-startAt)/1000);if(i>=0&&i<seconds){counts[i]++;if(e.z==='index')index++;if(e.z==='middle')middle++}}const total=counts.reduce((a,b)=>a+b,0),peak=Math.max(...counts),average=(total/seconds).toFixed(1),pct=(overlapMs/seconds/10).toFixed(1);$('total').textContent=total;$('avg').textContent=average;$('peak').textContent=peak;const separated=$('layout').value!=='single';const same=events.slice(1).reduce((n,e,i)=>n+(e.z===events[i].z?1:0),0);const rect=pad.getBoundingClientRect();const near=events.filter(e=>Math.abs((e.x-rect.left)/rect.width-.5)<.12).length;const sequence=events.map(e=>e.z==='index'?'人':e.z==='middle'?'中':'全').join('');$('details').textContent=separated?'人差し指：'+index+'回 ／ 中指：'+middle+'回 ／ 同時接触：'+overlapCount+'回 ／ 重なった時間：'+Math.round(overlapMs)+'ms（'+pct+'%）':'指別計測なし ／ 2点以上の同時接触：'+overlapCount+'回 ／ 重なった時間：'+Math.round(overlapMs)+'ms（'+pct+'%）';$('details').textContent+=' ／ 同じエリア連続：'+same+'回 ／ 左右境界付近：'+near+'回';$('bars').replaceChildren();$('ticks').replaceChildren();const max=Math.max(1,...counts);counts.forEach((n,i)=>{const b=document.createElement('div');b.className='bar';b.style.height=Math.max(3,n/max*95)+'px';const s=document.createElement('span');s.textContent=n;b.append(s);$('bars').append(b);const tick=document.createElement('span');tick.textContent=i+1;$('ticks').append(tick)});$('results').hidden=false;
const layouts={lr:'左右分割',tb:'上下分割',diag:'斜め配置',single:'全面'};lastReport=['【交互タップ測定 v2.1】','端末：'+(/iPad/.test(navigator.userAgent)||navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1?'iPad':/iPhone/.test(navigator.userAgent)?'iPhone':'その他'),'測定時間：'+seconds+'秒','配置：'+layouts[$('layout').value]+'（'+($('swap').value==='reverse'?'指の配置を反転':'通常配置')+'）','合計：'+total+'回','平均：'+average+' CPS','最高1秒：'+peak+'回','1秒ごと：'+counts.map((n,i)=>(i+1)+'秒='+n).join('、'),separated?'人差し指：'+index+'回':'指別計測：なし',separated?'中指：'+middle+'回':'', '同時接触の開始：'+overlapCount+'回','同時接触の累計：'+Math.round(overlapMs)+'ms（'+pct+'%）','同じエリア連続：'+same+'回','左右境界付近：'+near+'回','判定順序：'+sequence,'※同時接触は画面上のタッチ重なりを計測'].filter(Boolean).join('\n')}
function begin(){if(mode==='running'||mode==='countdown')return;clearTimer();events=[];touches.clear();overlapMs=overlapCount=0;overlapStart=null;$('results').hidden=true;$('copymsg').textContent='';modeSet('countdown');overlay.hidden=false;let left=3;overlay.textContent='開始まで '+left;status.textContent='準備中';timer=setInterval(()=>{left--;if(left>0){overlay.textContent='開始まで '+left;return}clearTimer();startAt=now();modeSet('running');overlay.hidden=true;status.textContent='残り '+seconds.toFixed(1)+'秒';timer=setInterval(()=>{const t=now();if(t>=startAt+seconds*1000){finish();return}status.textContent='残り '+((startAt+seconds*1000-t)/1000).toFixed(1)+'秒 ｜ '+events.length+'回'},40)},1000)}
pad.addEventListener('touchstart',e=>{if(e.cancelable)e.preventDefault();const t=now();for(const x of e.changedTouches)touchDown(x.identifier,x.clientX,x.clientY,t)},{passive:false});for(const type of ['touchend','touchcancel'])pad.addEventListener(type,e=>{if(e.cancelable)e.preventDefault();const t=now();for(const x of e.changedTouches)touchUp(x.identifier,t)},{passive:false});pad.addEventListener('contextmenu',e=>e.preventDefault());pad.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')touchDown('mouse',e.clientX,e.clientY,now())});pad.addEventListener('pointerup',e=>{if(e.pointerType==='mouse')touchUp('mouse',now())});
$('durations').addEventListener('click',e=>{const b=e.target.closest('button[data-s]');if(!b||mode==='running'||mode==='countdown')return;seconds=Number(b.dataset.s);document.querySelectorAll('#durations button').forEach(x=>x.classList.toggle('selected',x===b))});$('layout').addEventListener('change',renderLayout);$('swap').addEventListener('change',renderLayout);$('start').addEventListener('click',begin);$('reset').addEventListener('click',()=>{clearTimer();events=[];touches.clear();overlapStart=null;overlapMs=overlapCount=0;modeSet('idle');status.textContent='待機中';overlay.hidden=false;overlay.textContent='開始ボタンを押してね';$('results').hidden=true});
$('copy').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(lastReport)}else{const a=document.createElement('textarea');a.value=lastReport;a.style.position='fixed';a.style.opacity='0';document.body.append(a);a.focus();a.select();if(!document.execCommand('copy'))throw Error('copy');a.remove()}$('copymsg').textContent='コピーできました！ ChatGPTに貼り付けてね'}catch(e){$('copymsg').textContent='自動コピーできませんでした。Safariで開いて再試行してね'}});renderLayout();
})();
</script></body></html>
